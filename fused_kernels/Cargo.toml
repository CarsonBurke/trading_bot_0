[package]
name = "fused_kernels"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
# The kernels are compiled into a static archive of their own. Declaring a `links` key
# keeps two copies of this crate from ever landing in one binary, which would duplicate
# every `__global__` symbol.
links = "fused_kernels"

[dependencies]
tch = { git = "https://github.com/LaurentMazare/tch-rs.git", rev = "bbf49e6", features = ["python-extension"] }
torch-sys = "0.25.0"
shared = { path = "../shared" }
anyhow = "1.0.98"
clap = { version = "4.5.21", features = ["derive"] }
# The allocator peak is only reachable through `torch.cuda`'s Python statistics - libtorch
# exposes no C++ entry point for it and `torch-sys` binds none - and the probe has to
# MEASURE the activation footprint it claims to remove rather than count it from shapes.
# Same version and feature as `trading_bots`, so one interpreter is initialized per process.
pyo3 = { version = "0.28.1", features = ["auto-initialize"] }

[build-dependencies]
anyhow = "1.0.98"
cc = "1.2"
